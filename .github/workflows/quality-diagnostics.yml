name: quality-diagnostics

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.57.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1
      - uses: actions/cache/restore@v6
        id: tools-cache
        with:
          path: target/quality-tools
          key: quality-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tooling/quality.json', 'rust-toolchain.toml') }}
      - run: just tools-install
      - uses: actions/cache/save@v6
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: target/quality-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - run: just all
