name: pull-request

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.57.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1
      - run: just ci

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.57.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1
      - uses: actions/cache/restore@v6
        id: tools-cache
        with:
          path: target/quality-tools
          key: quality-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tooling/quality.json', 'rust-toolchain.toml') }}
      - run: just tools-install
      - uses: actions/cache/save@v6
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: target/quality-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - run: just quality
      - name: Check public API compatibility
        env:
          SEMVER_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: just semver "$SEMVER_BASE"
      - name: Verify changed quality enforcement
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: just tooling-changes "$QUALITY_BASE"

  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|chore|refactor|test|build|ci|perf|revert)(\([a-z0-9._-]+\))?!?: [a-z].+$'
          status=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "Invalid commit subject: $subject" >&2
              status=1
            fi
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          if [ "$status" -ne 0 ]; then
            echo "Commit subjects must follow Conventional Commits with a lower-case description." >&2
            exit 1
          fi
